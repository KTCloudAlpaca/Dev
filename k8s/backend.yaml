apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: launcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: launcher-backend:v1
          # 서버에서 직접 빌드한 이미지를 쓰므로 레지스트리에서 받지 않는다
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            # 계정 정보가 들어 있어 Secret에서 읽는다 (생성 방법은 README 참고)
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MONGODB_URI
          # HPA가 CPU 사용률을 계산하려면 requests가 필요하다
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
---
# frontend nginx가 http://backend:5000 으로 프록시하므로 이름은 backend 로 유지
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: launcher
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
